name: Build Norwegian Bliss social images
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-social-assets.yml
      - scripts/generate_social_assets.py
permissions:
  contents: write
jobs:
  social-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install Pillow==11.3.0
      - name: Render share card and touch icon
        run: python scripts/generate_social_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/norwegian-bliss-share.jpg assets/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Norwegian Bliss photo share card and touch icon"
            git push
          fi
